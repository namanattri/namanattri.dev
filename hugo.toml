baseURL = 'https://namanattri.dev/'
enableRobotsTXT = true
locale = 'en-US'
title = 'Naman Attri'
theme = 'namanattri'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Posts embed their own HTML and <style> blocks.
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[params]
  description = "Backend engineer who turns hard problems into simple, dependable systems. My work spans blockchain, DevOps, cloud and Gen & Agentic AI, and I write down what I learn along the way."
  mainSections = ['posts']
  math = true
  googleTag = 'G-K12F1YKP9F'
  [params.author]
    name = 'Naman Attri'
    # Resolved from the site's assets directory.
    image = 'images/author.png'
    # Drives the live "building software for" clock in the sidebar.
    careerStart = '2013-02-01'

  # All four icons always show; unset ones link to the network's home page.
  [params.social]
    github = 'https://github.com/namanattri'
    # linkedin = ''
    # x = ''
    # instagram = ''
    # youtube = ''

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 10

[[menus.main]]
  name = 'Blog'
  pageRef = '/posts'
  weight = 20
