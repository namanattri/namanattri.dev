<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#content">{{ i18n "skipToContent" }}</a>
  <div class="layout">
    {{ partial "sidebar.html" . }}
    <main class="content" id="content" tabindex="-1" data-scroller>
      {{ block "main" . }}{{ end }}
    </main>
  </div>
</body>
</html>
