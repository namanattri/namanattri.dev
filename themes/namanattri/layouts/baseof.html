<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body data-blog-url="{{ with site.GetPage (index site.Params.mainSections 0) }}{{ .RelPermalink }}{{ end }}" data-posts-index="{{ with site.Home.OutputFormats.Get "JSON" }}{{ .RelPermalink }}{{ end }}">
  <a class="skip-link" href="#content">{{ i18n "skipToContent" }}</a>
  <div class="layout">
    {{ partial "theme-toggle.html" . }}
    {{ partial "sidebar-toggle.html" (dict "kind" "expand") }}
    {{ partial "sidebar.html" . }}
    <main class="content" id="content" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
</body>
</html>
