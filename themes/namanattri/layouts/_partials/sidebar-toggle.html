{{/* kind: "collapse" (inside the sidebar) or "expand" (shown on the page while the sidebar is collapsed). */}}
{{- $label := cond (eq .kind "collapse") (i18n "sidebarCollapse") (i18n "sidebarExpand") -}}
<button class="sidebar-toggle sidebar-toggle--{{ .kind }}" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="{{ $label }}" title="{{ $label }}" data-sidebar-toggle>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
</button>
