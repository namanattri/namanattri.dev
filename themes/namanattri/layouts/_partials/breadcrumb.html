<nav class="breadcrumb" aria-label="{{ i18n "breadcrumb" }}">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ if .IsHome }}{{ i18n "home" }}{{ else }}{{ .LinkTitle }}{{ end }}</a></li>
    {{- end }}
    <li aria-current="page">{{ .LinkTitle }}</li>
  </ol>
</nav>
