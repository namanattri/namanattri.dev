{{/* One button cycling system, light and dark. JS sets data-mode and the accessible name. */}}
<button class="theme-toggle" type="button" data-theme-toggle data-mode="system"
  data-label="{{ i18n "themeLabel" }}"
  data-label-system="{{ i18n "themeSystem" }}"
  data-label-light="{{ i18n "themeLight" }}"
  data-label-dark="{{ i18n "themeDark" }}"
  aria-label="{{ i18n "themeLabel" }}: {{ i18n "themeSystem" }}">
  <svg class="theme-toggle__icon theme-toggle__icon--system" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
